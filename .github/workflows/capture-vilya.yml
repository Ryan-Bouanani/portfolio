name: Capture Vilya homepage for portfolio
on:
  push:
    branches:
      - fix/full-image-covers-vilya-2026-11
    paths:
      - .github/workflows/capture-vilya.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-image-covers-vilya-2026-11
          persist-credentials: true
      - name: Prepare browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture actual public homepage
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:940},deviceScaleFactor:1});
            const response = await page.goto('https://vilya.fr/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(5000);
            const info = await page.evaluate(() => ({title:document.title,body:document.body?.innerText?.slice(0,1200)}));
            console.log(JSON.stringify({status:response?.status(),title:info.title,bodySnippet:info.body.slice(0,350)}));
            if (!response || response.status() >= 400 || !/Vilya/i.test(info.title) || !/PROTÉGEZ|FORTILOCK|VOITURE/i.test(info.body)) {
              throw new Error('Unexpected response, refusing to commit a false screenshot');
            }
            await page.screenshot({path:'vilya-home.png',fullPage:false});
            await browser.close();
          })().catch(e => { console.error(e); process.exitCode=1; });
          NODE
      - name: Commit screenshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vilya-home.png
          git commit -m "Capture real Vilya homepage screenshot" && git push
